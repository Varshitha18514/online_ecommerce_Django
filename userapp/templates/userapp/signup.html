<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center><h1>Signup page</h1></center>
    <center>
        <form method="post">
            {% csrf_token %}
            <input type="text" placeholder="Enter username" required name="username">
            <br>
            <input type="text" placeholder="Enter Email" required name="email">
            <br>
            <input type="text" placeholder="Enter password" required name="phone">
            <br>
            <input type="text" placeholder="Enter Password" required name="password">
            <br>
            <button>Signup</button> 
        </form>
    </center>
</body>
</html>
