<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;margin: 0;
        }
        .navbar{
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 75px;
            width: 100%;
            background-color: blueviolet;
            color: white;
        }
        .right{
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            width: 30%;
        }

        .container{
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            margin-top: 20px;

        }

        .products{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            justify-content: center;
            width: 60%;
            margin:20px auto;
        }
        .products > div {
            box-shadow: 0 0 10px black;
            padding: 10px;
            border-radius: 20px;
            text-align: center;
        }    

        .products button{
            height: 30px;
            width: 50px;
            margin-top: 20px;
            background-color: blueviolet;
            color: white;
            font-weight: bolder;
            border: none;
            padding: 5px;
            border-radius: 10px;
            display: block;
            margin: 20px auto;
        }
            

    </style>
</head>
<body>

    <div class="navbar">
     <div class="left">
     <h2>LOGO</h2>
     </div>
     <div class="right">
     <h2>Product</h2>
     <h2>Orders</h2>   
     </div>
    </div>
    <center><h1>Welcome to Dashboard</h1></center>
    <div class="products">
        {% for i in products %}
            <div class="product">
                <img src="{{i.Product_image.url}}" height="250px" width="200px" alt=""><br>
                <button>view</button>
            </div>
    {% endfor %}
    </div>

</body>
</html>
